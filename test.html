<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>吳凡數學 - 116 學測電子紀念卡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #060a17;
            touch-action: manipulation;
        }
        /* 隱藏預設檔案上傳按鈕 */
        #realFileIn {
            display: none;
        }
        /* 彈跳預覽視窗動畫 */
        .modal-fade {
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="min-h-screen text-white flex flex-col items-center justify-between p-4 pb-8">

    <header class="w-full max-w-md text-center py-2">
        <h1 class="text-xl font-black tracking-widest text-amber-400">WF-116 MEMORY</h1>
        <p class="text-xs text-slate-400 mt-1">學測戰區電子紀念卡生成器</p>
    </header>

    <main class="w-full max-w-md flex flex-col items-center gap-4 my-2">
        <div class="w-full aspect-[9/16] bg-slate-900 rounded-2xl shadow-2xl overflow-hidden border border-slate-800 relative flex items-center justify-center">
            <!-- 畫布設定為高解析度 1080x1920，確保產出的圖檔極度清晰 -->
            <canvas id="cardCanvas" width="1080" height="1920" class="w-full h-full object-contain"></canvas>
        </div>

        <div class="w-full bg-slate-900/85 backdrop-blur border border-slate-800 rounded-2xl p-4 flex flex-col gap-3 shadow-xl">
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">1. 選擇或拍攝你的當前狀態照</label>
                <label for="realFileIn" class="w-full block bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl text-center cursor-pointer transition shadow-lg text-sm">
                    📷 點此上傳 / 拍攝照片
                </label>
                <input type="file" id="realFileIn" accept="image/*">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">2. 輸入你的戰鬥宣言（最多 12 字）</label>
                <input type="text" id="userTextInput" value="為台大電機而戰" maxlength="12" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white text-base focus:outline-none focus:border-amber-400 transition" placeholder="輸入想顯示在卡片上的話...">
            </div>

            <button id="generateBtn" class="w-full bg-amber-400 hover:bg-amber-300 active:bg-amber-500 text-slate-950 font-black py-3.5 px-4 rounded-xl text-center shadow-lg transition text-base mt-1">
                ✨ 一鍵合成紀念卡片
            </button>
        </div>
    </main>

    <footer class="w-full max-w-md text-center text-[11px] text-slate-500">
        吳凡數學 • 決不退縮與您並肩作戰
    </footer>

    <!-- 彈跳預覽視窗（解決 iOS Safari 無法直接下載的痛點，讓使用者長按圖片儲存） -->
    <div id="resultModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex flex-col items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 flex flex-col items-center modal-fade shadow-2xl relative">
            <h3 class="text-base font-bold text-amber-400 mb-2">🎉 紀念卡合成完畢！</h3>
            <p class="text-xs text-slate-300 text-center mb-4">
                <span class="text-amber-300 font-bold">iOS / Android 用戶：</span><br>請直接「長按下方圖片」儲存至手機相簿。
            </p>
            
            <div class="w-full aspect-[9/16] bg-black rounded-xl overflow-hidden mb-4 border border-slate-700 relative shadow-inner">
                <img id="resultImagePreview" class="w-full h-full object-contain" alt="合成紀念卡預覽">
            </div>

            <div class="flex gap-2 w-full">
                <button id="closeModalBtn" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl text-sm transition">
                    關閉重試
                </button>
                <a id="downloadLink" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl text-sm text-center transition flex items-center justify-center" download="WF116-Memory-Card.png">
                    直接下載檔案
                </a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('cardCanvas');
        const ctx = canvas.getContext('2d');
        const realFileIn = document.getElementById('realFileIn');
        const userTextInput = document.getElementById('userTextInput');
        const generateBtn = document.getElementById('generateBtn');
        
        const resultModal = document.getElementById('resultModal');
        const resultImagePreview = document.getElementById('resultImagePreview');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const downloadLink = document.getElementById('downloadLink');

        let uploadedImage = null;
        const cardId = "No." + Math.floor(10000 + Math.random() * 90000);

        // 核心繪製邏輯：將外框、圖片、動態文字、時間戳記完美融合成單一圖層
        function drawCard() {
            // 1. 卡片底色（高質感純白卡片基底）
            ctx.fillStyle = '#ffffff';
            roundRect(ctx, 40, 40, 1000, 1840, 24, true, false);

            // 2. 頂部深藍色榮譽橫幅
            ctx.fillStyle = '#0f1a30';
            roundRect(ctx, 40, 40, 1000, 180, {tl: 24, tr: 24, bl: 0, br: 0}, true, false);

            // 頂部橫幅文字
            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 38px sans-serif';
            ctx.fillText('WF-116', 80, 130);

            ctx.fillStyle = '#ffffff';
            ctx.font = '32px sans-serif';
            ctx.fillText('2027 116學測 • MEMORY', 240, 130);

            // 右上角隨機編號
            ctx.textAlign = 'right';
            ctx.fillStyle = '#94a3b8';
            ctx.font = 'bold 30px sans-serif';
            ctx.fillText(cardId, 1000, 130);
            ctx.textAlign = 'left';

            // 3. 中間照片區域（照片裁切並完美貼合）
            ctx.save();
            ctx.beginPath();
            ctx.rect(80, 250, 920, 1050);
            ctx.clip();

            if (uploadedImage) {
                drawCoverImage(ctx, uploadedImage, 80, 250, 920, 1050);
            } else {
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(80, 250, 920, 1050);
                ctx.fillStyle = '#64748b';
                ctx.font = '36px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('（點擊上方按鈕上傳照片）', 540, 775);
                ctx.textAlign = 'left';
            }
            ctx.restore();

            // 4. 底部白色資訊區與分隔線
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(80, 1340);
            ctx.lineTo(1000, 1340);
            ctx.stroke();

            // 標題前綴
            ctx.fillStyle = '#64748b';
            ctx.font = '32px sans-serif';
            ctx.fillText('我為', 80, 1410);

            ctx.fillStyle = '#b91c1c';
            ctx.font = 'bold 38px sans-serif';
            ctx.fillText('吳凡數學 116 戰區', 160, 1410);

            // 學生自訂的動態標題大字
            ctx.fillStyle = '#0f1a30';
            ctx.font = '900 64px sans-serif';
            let userText = userTextInput.value || "頂標上榜";
            if(userText.length > 12) userText = userText.substring(0, 12) + '...';
            ctx.fillText(userText, 80, 1500);

            // 動態抓取當下產生的時間戳記
            const now = new Date();
            const dateStr = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')}`;
            ctx.fillStyle = '#64748b';
            ctx.font = '30px sans-serif';
            ctx.fillText(`DATE: ${dateStr}  •  TAIPEI / WU-FAN MATH`, 80, 1570);

            // 5. 右下角現場認證標籤
            ctx.fillStyle = '#0f1a30';
            roundRect(ctx, 750, 1630, 250, 60, 30, true, false);
            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 26px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('✔ 戰區現場認證', 875, 1670);
            ctx.textAlign = 'left';

            // 版權裝飾字
            ctx.fillStyle = '#cbd5e1';
            ctx.font = '24px sans-serif';
            ctx.fillText('WF-116 SUMMIT PASS OFFICIAL MEMORY CARD', 80, 1780);
        }

        // 圓角矩形輔助函式
        function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
            let r = radius;
            if (typeof r === 'number') {
                r = {tl: r, tr: r, bl: r, br: r};
            } else {
                r = Object.assign({tl: 0, tr: 0, bl: 0, br: 0}, r);
            }
            ctx.beginPath();
            ctx.moveTo(x + r.tl, y);
            ctx.lineTo(x + width - r.tr, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + r.tr);
            ctx.lineTo(x + width, y + height - r.br);
            ctx.quadraticCurveTo(x + width, y + height, x + width - r.br, y + height);
            ctx.lineTo(x + r.bl, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - r.bl);
            ctx.lineTo(x, y + r.tl);
            ctx.quadraticCurveTo(x, y, x + r.tl, y);
            ctx.closePath();
            if (fill) ctx.fill();
            if (stroke) ctx.stroke();
        }

        // 圖片等比例填滿輔助函式
        function drawCoverImage(ctx, img, x, y, w, h) {
            let imgRatio = img.width / img.height;
            let targetRatio = w / h;
            let renderW, renderH, renderX, renderY;

            if (imgRatio > targetRatio) {
                renderH = h;
                renderW = h * imgRatio;
                renderX = x + (w - renderW) / 2;
                renderY = y;
            } else {
                renderW = w;
                renderH = w / imgRatio;
                renderX = x;
                renderY = y + (h - renderH) / 2;
            }
            ctx.drawImage(img, renderX, renderY, renderW, renderH);
        }

        // 監聽照片上傳
        realFileIn.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        uploadedImage = img;
                        drawCard();
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        // 監聽文字輸入實時即時更新畫布預覽
        userTextInput.addEventListener('input', drawCard);

        // 點擊「一鍵合成紀念卡片」按鈕（完美解決 iOS Safari 無法直接下載的問題）
        generateBtn.addEventListener('click', function() {
            drawCard();
            const dataURL = canvas.toDataURL('image/png');
            resultImagePreview.src = dataURL;
            downloadLink.href = dataURL;
            resultModal.classList.remove('hidden');
        });

        // 關閉彈跳視窗
        closeModalBtn.addEventListener('click', function() {
            resultModal.classList.add('hidden');
        });

        resultModal.addEventListener('click', function(e) {
            if (e.target === resultModal) {
                resultModal.classList.add('hidden');
            }
        });

        // 初次執行初始化畫布
        drawCard();
    </script>
</body>
</html>
