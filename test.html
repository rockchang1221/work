<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吳凡數學 - 116 學測電子紀念卡</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: #060a17;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        h1 {
            font-size: 1.1rem;
            text-align: center;
            letter-spacing: 2px;
            color: #ffd700;
        }
        .preview-container {
            width: 100%;
            aspect-ratio: 9/16;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
        }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 16px;
        }
        .control-panel {
            background: #0f1a30;
            border: 1px solid #1e355e;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-size: 0.8rem;
            color: #8fa3c7;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            background: #060a17;
            border: 1px solid #2a477d;
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #ffd700;
        }
        .file-btn {
            background: #1d3557;
            color: white;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            border: 1px solid #2c4f82;
        }
        #realFileIn {
            display: none;
        }
        .save-btn {
            background: #ffd700;
            color: #060a17;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .tip {
            font-size: 0.7rem;
            text-align: center;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>WF-116 MEMORY 紀念卡</h1>
    
    <div class="preview-container">
        <!-- 畫布固定高解析度 1080x1920 -->
        <canvas id="cardCanvas" width="1080" height="1920"></canvas>
    </div>

    <div class="control-panel">
        <div class="control-group">
            <label>1. 更換卡片中央照片</label>
            <label for="realFileIn" class="file-btn">📷 選擇照片 / 自拍</label>
            <input type="file" id="realFileIn" accept="image/*">
        </div>

        <div class="control-group">
            <label>2. 輸入你的戰鬥宣言（例如：為台大電機而戰）</label>
            <input type="text" id="userTextInput" value="為台大電機而戰" placeholder="輸入想顯示在卡片上的話...">
        </div>

        <button class="save-btn" id="saveBtn">📥 下載我的紀念卡</button>
    </div>
    <div class="tip">手機用戶請點擊下載後長按圖片儲存至相簿分享至 IG</div>
</div>

<script>
    const canvas = document.getElementById('cardCanvas');
    const ctx = canvas.getContext('2d');
    const realFileIn = document.getElementById('realFileIn');
    const userTextInput = document.getElementById('userTextInput');
    const saveBtn = document.getElementById('saveBtn');

    let uploadedImage = null;
    // 隨機產生一個紀念卡編號
    const cardId = "No." + Math.floor(10000 + Math.random() * 90000);

    // 載入預設圖片或畫布初始化
    function drawCard() {
        // 1. 卡片整體底色（純白卡片基底，模擬高級紙張）
        ctx.fillStyle = '#ffffff';
        roundRect(ctx, 40, 40, 1000, 1840, 24, true, false);

        // 2. 頂部紅色/深藍色榮譽橫幅
        ctx.fillStyle = '#0f1a30';
        roundRect(ctx, 40, 40, 1000, 180, {tl: 24, tr: 24, bl: 0, br: 0}, true, false);

        // 頂部橫幅文字
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 38px sans-serif';
        ctx.fillText('WF-116', 80, 130);

        ctx.fillStyle = '#ffffff';
        ctx.font = '32px sans-serif';
        ctx.fillText('2027 116學測 • MEMORY', 240, 130);

        // 右上角編號
        ctx.textAlign = 'right';
        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 30px sans-serif';
        ctx.fillText(cardId, 1000, 130);
        ctx.textAlign = 'left'; // 恢復預設

        // 3. 中間照片區域（如果有的話就畫上，沒有就先填深色佔位）
        ctx.save();
        ctx.beginPath();
        // 挖出照片擺放區: X: 80, Y: 250, 寬: 920, 高: 1050
        ctx.rect(80, 250, 920, 1050);
        ctx.clip();

        if (uploadedImage) {
            // 讓上傳的照片等比例填滿這個區域
            drawCoverImage(ctx, uploadedImage, 80, 250, 920, 1050);
        } else {
            // 預設佔位底色
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(80, 250, 920, 1050);
            ctx.fillStyle = '#64748b';
            ctx.font = '36px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('（點擊下方按鈕上傳照片）', 540, 775);
            ctx.textAlign = 'left';
        }
        ctx.restore();

        // 4. 底部白色資訊區
        // 畫一條分隔裝飾線
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(80, 1340);
        ctx.lineTo(1000, 1340);
        ctx.stroke();

        // 標題前綴：「我為 ...... 而戰」
        ctx.fillStyle = '#64748b';
        ctx.font = '32px sans-serif';
        ctx.fillText('我為', 80, 1410);

        // 目標對象（黃色高亮字體）
        ctx.fillStyle = '#b91c1c'; // 可以用深紅或吳凡的代表色
        ctx.font = 'bold 38px sans-serif';
        ctx.fillText('吳凡數學 116 戰區', 160, 1410);

        // 學生動態輸入的大標題（類似味全龍卡片的 RUN FOR HONOR）
        ctx.fillStyle = '#0f1a30';
        ctx.font = '900 64px sans-serif';
        let userText = userTextInput.value || "頂標上榜";
        if(userText.length > 12) userText = userText.substring(0, 12) + '...';
        ctx.fillText(userText, 80, 1500);

        // 日期與地點資訊
        const now = new Date();
        const dateStr = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')}`;
        ctx.fillStyle = '#64748b';
        ctx.font = '30px sans-serif';
        ctx.fillText(`DATE: ${dateStr}  •  TAIPEI / WU-FAN MATH`, 80, 1570);

        // 5. 右下角擬真標籤（現場認證 / 應援認證）
        ctx.fillStyle = '#0f1a30';
        roundRect(ctx, 750, 1630, 250, 60, 30, true, false);
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 26px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('✔ 戰區現場認證', 875, 1670);
        ctx.textAlign = 'left';

        // 底部微小版權裝飾
        ctx.fillStyle = '#cbd5e1';
        ctx.font = '24px sans-serif';
        ctx.fillText('WF-116 SUMMIT PASS OFFICIAL MEMORY CARD', 80, 1780);
    }

    // 輔助函式：畫圓角矩形
    function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
        let r = radius;
        if (typeof r === 'number') {
            r = {tl: r, tr: r, bl: r, br: r};
        } else {
            r = Object.assign({tl: 0, tr: 0, bl: 0, br: 0}, r);
        }
        ctx.beginPath();
        ctx.moveTo(x + r.tl, y);
        ctx.lineTo(x + width - r.tr, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + r.tr);
        ctx.lineTo(x + width, y + height - r.br);
        ctx.quadraticCurveTo(x + width, y + height, x + width - r.br, y + height);
        ctx.lineTo(x + r.bl, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - r.bl);
        ctx.lineTo(x, y + r.tl);
        ctx.quadraticCurveTo(x, y, x + r.tl, y);
        ctx.closePath();
        if (fill) ctx.fill();
        if (stroke) ctx.stroke();
    }

    // 輔助函式：讓圖片等比例 Cover 填滿區塊
    function drawCoverImage(ctx, img, x, y, w, h) {
        let imgRatio = img.width / img.height;
        let targetRatio = w / h;
        let renderW, renderH, renderX, renderY;

        if (imgRatio > targetRatio) {
            renderH = h;
            renderW = h * imgRatio;
            renderX = x + (w - renderW) / 2;
            renderY = y;
        } else {
            renderW = w;
            renderH = w / imgRatio;
            renderX = x;
            renderY = y + (h - renderH) / 2;
        }
        ctx.drawImage(img, renderX, renderY, renderW, renderH);
    }

    // 監聽檔案上傳
    realFileIn.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    uploadedImage = img;
                    drawCard();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }
    });

    // 監聽文字輸入
    userTextInput.addEventListener('input', function() {
        drawCard();
    });

    // 儲存按鈕
    saveBtn.addEventListener('click', function() {
        const dataURL = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = 'WF116-Memory-Card.png';
        link.href = dataURL;
        link.click();
    });

    // 初始化畫布
    drawCard();
</script>

</body>
</html>
