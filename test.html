<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 加入這個 meta 標籤加強跨域防護過關率 -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>蝦皮好物研究中心 | 嚴選平價酷東西</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        body { 
            font-family: 'Inter', 'Noto Sans TC', sans-serif; 
            background-color: #ffffff;
            color: #171717;
            -webkit-font-smoothing: antialiased;
        }
        
        ::-webkit-scrollbar { display: none; }
        
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen selection:bg-neutral-900 selection:text-white">

    <header class="w-full bg-white/90 backdrop-blur-sm sticky top-0 z-40 border-b border-neutral-100">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center gap-4">
            <!-- 左側 Logo -->
            <a href="#" class="text-xl font-black tracking-tight text-neutral-900 shrink-0">
                蝦皮好物<span class="font-normal text-neutral-400 ml-1">研究中心</span>
            </a>
            
            <!-- 右側選單 Menu (極簡化) -->
            <nav class="flex gap-6">
                <a href="#" class="text-sm font-bold text-neutral-900 hover:text-neutral-600 transition-colors">精選好物</a>
                <a href="#" class="text-sm font-bold text-neutral-400 hover:text-neutral-900 transition-colors">使用者須知</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-6 w-full pb-32">
        
        <div class="w-full pt-8 pb-8 mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 border-b border-neutral-100">
            
            <!-- 左側：篩選器 -->
            <div class="flex items-center gap-6 shrink-0">
                <button class="flex items-center gap-2 text-sm font-bold text-neutral-900 hover:text-neutral-600 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75" />
                    </svg>
                    篩選分類
                </button>
                <div class="flex gap-4">
                    <span class="text-sm font-bold text-neutral-900 cursor-pointer border-b-2 border-neutral-900 pb-1">最近更新</span>
                    <span class="text-sm font-medium text-neutral-400 hover:text-neutral-900 cursor-pointer transition-colors pb-1">熱度最高</span>
                </div>
            </div>

            <!-- 右側：獨立搜尋框 -->
            <div class="w-full md:w-96 relative group">
                <input type="text" placeholder="搜索你想要的長輩神器或酷東西..." class="w-full border-2 border-neutral-100 rounded-lg text-sm py-2.5 pl-4 pr-10 focus:outline-none focus:border-neutral-900 transition-colors text-neutral-900 font-medium">
                <button class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-400 group-focus-within:text-neutral-900 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                    </svg>
                </button>
            </div>
            
        </div>

        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-x-6 gap-y-12">
            <!-- 內容由 JS 產生 -->
        </div>
    </main>

    <div id="productModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 sm:p-6 bg-black/70 backdrop-blur-sm transition-opacity duration-300 opacity-0 pointer-events-none" onclick="handleBackdropClick(event)">
        <!-- 內容容器 -->
        <div id="modalContent" class="relative bg-white rounded-xl shadow-2xl overflow-hidden w-full transition-transform duration-300 scale-95 flex">
            <!-- 動態生成內容 -->
        </div>
    </div>

    <footer class="w-full border-t border-neutral-100 bg-white mt-auto">
        <div class="max-w-7xl mx-auto px-6 py-12 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
            <div>
                <h4 class="text-neutral-900 font-bold text-lg tracking-tight mb-1">蝦皮好物研究中心</h4>
                <p class="text-xs text-neutral-400">© 2026 Shopee Research Center.</p>
            </div>
            <div class="text-left md:text-right">
                <p class="text-xs text-neutral-500 mb-4 md:mb-2 max-w-xs">
                    本站外部連結皆為蝦皮分潤連結。<br>您的每一次點擊，都是本所的研究經費。
                </p>
                <div class="flex gap-6 md:justify-end">
                    <a href="#" class="text-sm font-medium text-neutral-400 hover:text-neutral-900 transition-colors">IG</a>
                    <a href="#" class="text-sm font-medium text-neutral-400 hover:text-neutral-900 transition-colors">Threads</a>
                    <a href="#" class="text-sm font-medium text-neutral-400 hover:text-neutral-900 transition-colors">FB</a>
                </div>
            </div>
        </div>
    </footer>

    <script>
        const products = [
            {
                id: 'cushion',
                type: 'photo',
                media: 'https://placehold.co/800x600/eeeeee/999999?text=Cushion+High+Res',
                cardMedia: 'https://placehold.co/800x450/eeeeee/999999?text=Cushion+Photo',
                title: '人體工學護腰坐墊',
                text: '我們實際測試了兩週，底部的防滑效果不錯，重點是那個腰靠的包覆感真的有差。不到 400 塊的價格，直接無痛升級，CP 值極高。',
                link: '#'
            },
            {
                id: 'earbuds',
                type: 'video',
                // 執行長專屬：直接貼上你從 YouTube 複製下來的整段 iframe 代碼即可！
                rawIframe: `<iframe width="560" height="315" src="https://www.youtube.com/embed/0LJ6BiOGef8?si=oNCeZ_MXHzPss_TD" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`,
                cardMedia: 'https://placehold.co/800x450/eeeeee/999999?text=Earbuds+Video',
                title: '1:1 原版 Pro 3代',
                text: '如果習慣主動降噪、想體驗頂級體驗卻又不想被官方當盤子割韭菜的人，執行長我非常推薦直接升級～ 幾百塊的快樂，真的不用考慮太久！',
                link: '#'
            },
            {
                id: 'massage_gun',
                type: 'video',
                // 第二個測試影片：我們放一段別人的官方代碼測試穩定度
                rawIframe: `<iframe width="560" height="315" src="https://www.youtube.com/embed/riIsPoxrnbI?si=r4A3N7Q2M6vB1yKx" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`,
                cardMedia: 'https://placehold.co/800x450/eeeeee/999999?text=Massage+Gun+Video',
                title: '微型深層筋膜槍',
                text: '很多長輩都不知道，現在的科技已經這麼發達了！體積跟手機一樣小，卻能精準打通深層痠痛點。<br><br>金屬材質的震動穿透力，光看就覺得全身都鬆了！而且現在廠商直接破盤價，不用兩千連五百都不用，放客廳、放房間、送親戚一次搞定。',
                link: '#'
            },
            {
                id: 'diffuser',
                type: 'photo',
                media: 'https://placehold.co/800x600/eeeeee/999999?text=Diffuser+High+Res',
                cardMedia: 'https://placehold.co/800x450/eeeeee/999999?text=Diffuser+Photo',
                title: '木紋香氛水氧機',
                text: '秋冬乾燥必備。暖色黃光搭配冉冉上升的水霧，幾百塊就能無痛升級房間的質感與香氣。<br><br>放在床頭櫃或是電腦桌旁，不僅能緩解冷氣房的乾燥，看著煙霧也能達到意想不到的舒壓效果。',
                link: '#'
            }
        ];

        const productGrid = document.getElementById('productGrid');
        const modal = document.getElementById('productModal');
        const modalContent = document.getElementById('modalContent');

        function renderCards() {
            productGrid.innerHTML = ''; 

            products.forEach(product => {
                const videoIconHTML = product.type === 'video' ? `
                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                        <div class="bg-black/50 text-white p-3 rounded-full backdrop-blur-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 ml-1"><path fill-rule="evenodd" d="M4.5 5.653c0-1.427 1.529-2.33 2.779-1.643l11.54 6.347c1.295.712 1.295 2.573 0 3.286L7.28 19.99c-1.25.687-2.779-.217-2.779-1.643V5.653Z" clip-rule="evenodd" /></svg>
                        </div>
                    </div>
                ` : '';

                // 去除 HTML 標籤讓預覽卡片顯示純文字
                const rawText = product.text.replace(/<[^>]*>?/gm, '');

                const cardHTML = `
                    <article class="flex flex-col h-full group">
                        <div class="w-full aspect-video bg-neutral-100 overflow-hidden mb-4 relative rounded cursor-pointer" onclick="openModal('${product.id}')">
                            <img src="${product.cardMedia}" alt="${product.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
                            ${videoIconHTML}
                        </div>
                        <h2 class="text-lg font-bold text-neutral-900 mb-2 line-clamp-1">${product.title}</h2>
                        <p class="text-neutral-500 text-sm leading-relaxed mb-6 line-clamp-2 flex-grow">
                            ${rawText}
                        </p>
                        <div class="mt-auto flex items-center gap-2">
                            <button onclick="openModal('${product.id}')" class="flex-1 border border-neutral-200 hover:border-neutral-900 text-neutral-900 font-bold py-2.5 px-3 rounded text-xs transition-colors text-center">
                                查看介紹
                            </button>
                            <a href="${product.link}" target="_blank" class="flex-1 bg-neutral-900 hover:bg-neutral-800 text-white font-bold py-2.5 px-3 rounded text-xs transition-colors text-center border border-neutral-900">
                                蝦皮分潤
                            </a>
                        </div>
                    </article>
                `;
                
                productGrid.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        renderCards();

        function openModal(productId) {
            const data = products.find(p => p.id === productId);
            if (!data) return;

            // 替換大頭貼為「好」字，帳號改為「蝦皮好物研究中心」
            const postContentHTML = `
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center border border-orange-200 shrink-0">
                        <span class="text-orange-600 font-bold text-sm">好</span>
                    </div>
                    <div>
                        <div class="font-bold text-sm text-neutral-900 hover:underline cursor-pointer">蝦皮好物研究中心</div>
                        <div class="text-xs text-neutral-400">執行長推薦</div>
                    </div>
                </div>
                <h2 class="text-2xl font-black mb-4 text-neutral-900">${data.title}</h2>
                <div class="text-neutral-600 text-sm leading-loose mb-8 flex-grow">
                    ${data.text}
                </div>
                <div class="mt-auto pt-6 border-t border-neutral-100">
                    <a href="${data.link}" target="_blank" class="block w-full bg-neutral-900 text-white font-bold py-3.5 rounded text-center hover:bg-neutral-800 transition-colors">
                        前往蝦皮領取優惠
                    </a>
                </div>
            `;

            const closeBtnHTML = `
                <button onclick="closeModal()" class="absolute top-4 right-4 z-50 text-neutral-400 hover:text-neutral-900 bg-white/80 hover:bg-white backdrop-blur-md p-1.5 rounded-full transition-colors shadow-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            `;

            if (data.type === 'video') {
                modalContent.className = "relative bg-white shadow-2xl overflow-hidden transition-transform duration-300 scale-95 flex flex-col md:flex-row w-full max-w-[400px] md:max-w-none md:w-auto h-[80vh] md:h-[85vh]";
                
                // 這裡！我們用 JS 把你貼的 iframe 官方代碼，強制替換成滿版 CSS class，這樣既不用拆解你的 ID，又能完美適應版面
                const responsiveIframe = data.rawIframe.replace('<iframe', '<iframe class="absolute inset-0 w-full h-full z-20"');
                
                modalContent.innerHTML = `
                    ${closeBtnHTML}
                    <div class="w-full md:w-auto h-auto md:h-full aspect-[9/16] bg-black relative flex items-center justify-center shrink-0 md:border-r border-neutral-200 overflow-hidden">
                        ${responsiveIframe}
                    </div>
                    <div class="w-full md:w-[360px] p-6 md:p-8 flex flex-col overflow-y-auto bg-white shrink-0">
                        ${postContentHTML}
                    </div>
                `;
            } else {
                modalContent.className = "relative bg-white rounded-xl shadow-2xl overflow-hidden w-full max-w-2xl transition-transform duration-300 scale-95 flex flex-col max-h-[90vh]";
                
                modalContent.innerHTML = `
                    ${closeBtnHTML}
                    <div class="w-full aspect-[4/3] bg-neutral-100 overflow-hidden shrink-0">
                        <img src="${data.media}" class="w-full h-full object-cover" alt="Product">
                    </div>
                    <div class="w-full p-6 md:p-8 flex flex-col overflow-y-auto no-scrollbar">
                        ${postContentHTML}
                    </div>
                `;
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            void modal.offsetWidth; 
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
            document.body.style.overflow = 'hidden'; 
        }

        function closeModal() {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.remove('flex'); 
                modal.classList.add('hidden');
                modalContent.innerHTML = ''; 
                document.body.style.overflow = '';
            }, 300);
        }

        function handleBackdropClick(event) {
            if (event.target === modal) closeModal();
        }
    </script>
</body>
</html>
