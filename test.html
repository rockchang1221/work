<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>電子紀念卡生成器 - 官方複刻版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700;1,900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #ffffff;
            color: #0f172a;
            touch-action: manipulation;
        }
        .font-display {
            font-family: 'Barlow Condensed', sans-serif;
        }
        #realFileIn {
            display: none;
        }
        .modal-fade {
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 sm:p-5 pb-8">

    <header class="w-full max-w-md text-center py-2">
        <h1 class="text-2xl font-black tracking-wider text-slate-800 font-display uppercase">WuFan Memory Card</h1>
        <p class="text-xs text-slate-500 font-medium">吳凡數學陪你戰115學測 · 專屬紀念卡生成系統</p>
    </header>

    <main class="w-full max-w-md flex flex-col items-center gap-4 my-2">
        <!-- 畫布預覽容器 (9:16) -->
        <div class="w-full aspect-[9/16] bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200 relative flex items-center justify-center">
            <canvas id="cardCanvas" width="1080" height="1920" class="w-full h-full object-contain"></canvas>
        </div>

        <div class="w-full bg-white border border-slate-200 rounded-2xl p-4 flex flex-col gap-3.5 shadow-sm">
            <!-- 1. 上傳照片 -->
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">1. 照片上傳 / 拍攝</label>
                <label for="realFileIn" class="w-full block bg-[#1b427d] hover:bg-[#153463] active:bg-[#0f2445] text-white font-bold py-2.5 px-4 rounded-xl text-center cursor-pointer transition shadow text-sm">
                    📷 點此上傳中央照片
                </label>
                <input type="file" id="realFileIn" accept="image/*">
            </div>

            <!-- 2. 姓名與目標大學 -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">2. 我的姓名</label>
                    <input type="text" id="userNameInput" value="吳小凡" maxlength="10" placeholder="例如：吳小凡" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-800 font-bold text-sm focus:outline-none focus:border-[#1b427d] transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">3. 目標大學</label>
                    <input type="text" id="targetUniInput" value="台灣" maxlength="12" placeholder="例如：台灣大學" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-800 font-bold text-sm focus:outline-none focus:border-[#1b427d] transition">
                </div>
            </div>

            <!-- 3. 給自己的一句話 -->
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">4. 想對自己說的一段話</label>
                <input type="text" id="userQuoteInput" value="全力以赴，頂標非我莫屬！" maxlength="28" placeholder="寫下一句堅持下去的決心..." class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-800 font-medium text-sm focus:outline-none focus:border-[#1b427d] transition">
            </div>

            <button id="generateBtn" class="w-full bg-[#1b427d] hover:bg-[#153463] active:bg-[#0f2445] text-white font-black py-3 px-4 rounded-xl text-center shadow-lg transition text-base mt-1">
                ✨ 合成高畫質卡片並匯出
            </button>
        </div>
    </main>

    <div id="resultModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex flex-col items-center justify-center p-4">
        <div class="bg-white border border-slate-200 w-full max-w-sm rounded-3xl p-5 flex flex-col items-center modal-fade shadow-2xl relative">
            <h3 class="text-base font-black text-slate-900 mb-1">🎉 紀念卡已合成完畢！</h3>
            <p class="text-xs text-slate-500 text-center mb-3">
                <span class="text-[#1b427d] font-bold">手機用戶：</span>請直接「長按下方圖片」選擇「加入照片」儲存至手機相簿。
            </p>
            
            <div class="w-full aspect-[9/16] bg-slate-100 rounded-xl overflow-hidden mb-4 border border-slate-200 relative shadow-inner">
                <img id="resultImagePreview" class="w-full h-full object-contain" alt="合成紀念卡預覽">
            </div>

            <div class="flex gap-2 w-full">
                <button id="closeModalBtn" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-sm transition">
                    關閉返回
                </button>
                <a id="downloadLink" class="flex-1 bg-[#1b427d] hover:bg-[#153463] text-white font-bold py-2.5 rounded-xl text-sm text-center transition flex items-center justify-center" download="WUFAN-115-MEMORY.png">
                    下載圖片檔案
                </a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('cardCanvas');
        const ctx = canvas.getContext('2d');
        const realFileIn = document.getElementById('realFileIn');
        const userNameInput = document.getElementById('userNameInput');
        const targetUniInput = document.getElementById('targetUniInput');
        const userQuoteInput = document.getElementById('userQuoteInput');
        const generateBtn = document.getElementById('generateBtn');
        
        const resultModal = document.getElementById('resultModal');
        const resultImagePreview = document.getElementById('resultImagePreview');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const downloadLink = document.getElementById('downloadLink');

        let uploadedImage = null;

        // 畫布基礎規格
        const W = 1080;
        const H = 1920;
        const BAND_H = 150;
        const PA = { x: 24, y: 172, w: 1032, h: 1260 }; // 照片區寬高與位置
        const FOOT_H = 46;
        const BRAND_COLOR = '#1b427d';
        const BRAND_DARK = '#122e58';
        const ACCENT_GOLD = 'rgba(251,191,36,0.9)';

        // 繪製圓角矩形
        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        // 繪製頂部獎盃線條
        function drawTrophy(ctx, cx, cy, color) {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = 5;
            ctx.lineJoin = "round";
            ctx.lineCap = "round";
            
            // 杯身
            ctx.beginPath();
            ctx.moveTo(cx - 22, cy - 26);
            ctx.lineTo(cx + 22, cy - 26);
            ctx.quadraticCurveTo(cx + 22, cy + 6, cx, cy + 10);
            ctx.quadraticCurveTo(cx - 22, cy + 6, cx - 22, cy - 26);
            ctx.stroke();

            // 兩側耳把
            ctx.beginPath();
            ctx.arc(cx - 26, cy - 14, 10, Math.PI * 0.5, Math.PI * 1.5);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(cx + 26, cy - 14, 10, Math.PI * 1.5, Math.PI * 0.5);
            ctx.stroke();

            // 底座
            ctx.beginPath();
            ctx.moveTo(cx, cy + 10);
            ctx.lineTo(cx, cy + 20);
            ctx.moveTo(cx - 14, cy + 24);
            ctx.lineTo(cx + 14, cy + 24);
            ctx.stroke();
            ctx.restore();
        }

        // 繪製照片未上傳時的淺灰色佔位區塊
        function drawPhotoPlaceholder(ctx, area) {
            ctx.fillStyle = '#f1f5f9';
            ctx.fillRect(area.x, area.y, area.w, area.h);

            // 繪製邊框
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 3;
            ctx.strokeRect(area.x + 1.5, area.y + 1.5, area.w - 3, area.h - 3);

            // 中間提示文字
            ctx.fillStyle = '#94a3b8';
            ctx.font = '700 48px "Noto Sans TC", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('📷 請點擊下方按鈕上傳照片', area.x + area.w / 2, area.y + area.h / 2);
        }

        // 繪製完整卡片內容
        function drawCard() {
            // 1. 純白卡片底色
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, W, H);

            // 2. 頂部深藍色橫幅 (高度 BAND_H = 150)
            const bandGrad = ctx.createLinearGradient(0, 0, 0, BAND_H);
            bandGrad.addColorStop(0, BRAND_COLOR);
            bandGrad.addColorStop(1, BRAND_DARK);
            ctx.fillStyle = bandGrad;
            ctx.fillRect(0, 0, W, BAND_H);

            // 頂部左側：只保留 "2026 WuFan Math"
            ctx.fillStyle = '#ffffff';
            ctx.font = '700 52px "Barlow Condensed", sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.letterSpacing = '1.5px';
            ctx.fillText('2026 WuFan Math', 48, BAND_H / 2);
            ctx.letterSpacing = '0px';

            // 頂部右側：只保留獎盃圖標
            drawTrophy(ctx, W - 68, BAND_H / 2, '#ffffff');

            // 頂部下緣 3px 細金線
            ctx.fillStyle = ACCENT_GOLD;
            ctx.fillRect(0, BAND_H - 3, W, 3);

            // 3. 中間照片區域 (x:24, y:172, w:1032, h:1260，圓角 r=14)
            ctx.save();
            roundRect(ctx, PA.x, PA.y, PA.w, PA.h, 14);
            ctx.clip();

            if (uploadedImage) {
                drawCoverImage(ctx, uploadedImage, PA.x, PA.y, PA.w, PA.h);
            } else {
                drawPhotoPlaceholder(ctx, PA);
            }
            ctx.restore();

            // 4. 左側細色條 (原版特徵：深藍色直條裝飾)
            const stripeX = 24;
            const stripeTop = PA.y + PA.h + 24;
            const stripeH = 370;
            ctx.fillStyle = BRAND_COLOR;
            ctx.fillRect(stripeX, stripeTop, 8, stripeH);

            // 5. 下方文字資訊區域
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';

            const startX = 58;

            // 第一行：我是＿＿＿
            const line1Y = PA.y + PA.h + 96;
            ctx.font = '900 68px "Noto Sans TC", sans-serif';
            ctx.fillStyle = '#0f172a';
            const nameVal = userNameInput.value.trim() || "吳小凡";
            ctx.fillText(`我是 ${nameVal}`, startX, line1Y);

            // 第二行：我要考上＿＿＿＿大學
            const line2Y = line1Y + 92;
            ctx.font = '900 64px "Noto Sans TC", sans-serif';
            ctx.fillStyle = BRAND_COLOR;
            const rawUni = targetUniInput.value.trim() || "台灣";
            const uniVal = rawUni.endsWith("大學") ? rawUni : `${rawUni}`;
            ctx.fillText(`我要考上 ${uniVal}`, startX, line2Y);

            // 第三行：想對自己說的一段話
            const line3Y = line2Y + 84;
            ctx.font = '500 38px "Noto Sans TC", sans-serif';
            ctx.fillStyle = '#334155';
            const quoteVal = userQuoteInput.value.trim() || "全力以赴，頂標非我莫屬！";
            ctx.fillText(quoteVal, startX, line3Y);

            // 第四行：日期與地點（地點固定為吳凡數學）
            const dateY = line3Y + 68;
            ctx.font = '600 30px "Barlow Condensed", "Noto Sans TC", sans-serif';
            ctx.fillStyle = '#64748b';
            ctx.letterSpacing = '1px';
            const now = new Date();
            const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
            const dateStr = `${months[now.getMonth()]} ${String(now.getDate()).padStart(2, '0')}, ${now.getFullYear()}`;
            ctx.fillText(`${dateStr} · 吳凡數學`, startX, dateY);
            ctx.letterSpacing = '0px';

            // 6. 最底層深藍色微型條 (高度 FOOT_H)
            ctx.fillStyle = BRAND_COLOR;
            ctx.fillRect(0, H - FOOT_H, W, FOOT_H);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.letterSpacing = '4px';
            ctx.font = '700 21px "Noto Sans TC", sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.fillText('吳凡數學陪你戰115學測', W / 2, H - FOOT_H / 2);
            ctx.letterSpacing = '0px';
        }

        // 圖片等比例裁切置中
        function drawCoverImage(ctx, img, x, y, w, h) {
            let imgRatio = img.width / img.height;
            let targetRatio = w / h;
            let renderW, renderH, renderX, renderY;

            if (imgRatio > targetRatio) {
                renderH = h;
                renderW = h * imgRatio;
                renderX = x + (w - renderW) / 2;
                renderY = y;
            } else {
                renderW = w;
                renderH = w / imgRatio;
                renderX = x;
                renderY = y + (h - renderH) / 2;
            }
            ctx.drawImage(img, renderX, renderY, renderW, renderH);
        }

        // 監聽照片上傳
        realFileIn.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        uploadedImage = img;
                        drawCard();
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        // 監聽文字輸入
        [userNameInput, targetUniInput, userQuoteInput].forEach(inp => {
            inp.addEventListener('input', drawCard);
        });

        // 合成按鈕
        generateBtn.addEventListener('click', function() {
            drawCard();
            const dataURL = canvas.toDataURL('image/png');
            resultImagePreview.src = dataURL;
            downloadLink.href = dataURL;
            resultModal.classList.remove('hidden');
        });

        closeModalBtn.addEventListener('click', () => resultModal.classList.add('hidden'));
        resultModal.addEventListener('click', (e) => {
            if (e.target === resultModal) resultModal.classList.add('hidden');
        });

        // 字體載入完畢後初次渲染
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(drawCard);
        } else {
            drawCard();
        }
    </script>
</body>
</html>
